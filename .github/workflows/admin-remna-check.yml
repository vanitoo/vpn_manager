name: Admin Remnawave checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m unittest -v tests.test_admin_user_mutations
