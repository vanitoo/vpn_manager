name: MTProto branch checks

on:
  push:
    branches:
      - feature/mtproto
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q app mtproto_control
      - run: pip install -r requirements.txt
      - run: python - <<'PY'
          import app.products.mtproto.storage
          import app.products.mtproto.client
          print('MTProto imports OK')
          PY
